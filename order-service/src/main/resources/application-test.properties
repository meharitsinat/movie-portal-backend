spring.datasource.url=jdbc:postgresql://${TEST_SUPABASE_DB_HOST}:${TEST_SUPABASE_DB_PORT:5432}/${TEST_SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${TEST_SUPABASE_DB_USERNAME}
spring.datasource.password=${TEST_SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${TEST_DB_POOL_MAX_SIZE:1}
spring.jpa.properties.hibernate.default_schema=order_service_test
spring.flyway.schemas=order_service_test
spring.flyway.default-schema=order_service_test
spring.flyway.create-schemas=true
app.jwt.secret-base64=${TEST_JWT_SECRET_BASE64}
app.cors.allowed-origins=${TEST_CORS_ALLOWED_ORIGINS:http://localhost:5173}
services.movie.base-url=${TEST_MOVIE_SERVICE_URL:http://localhost:8082}
stripe.secret-key=${TEST_STRIPE_SECRET_KEY:}
stripe.webhook-secret=${TEST_STRIPE_WEBHOOK_SECRET:}
