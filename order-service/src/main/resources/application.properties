server.port=${SERVER_PORT:8083}
spring.application.name=order-service
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=order_service
spring.flyway.schemas=order_service
spring.flyway.default-schema=order_service
spring.flyway.create-schemas=true
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
services.movie.base-url=${MOVIE_SERVICE_URL:http://localhost:8082}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/order?checkout=success&session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/order?checkout=cancelled}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
