spring.datasource.url=jdbc:postgresql://${PROD_SUPABASE_DB_HOST}:${PROD_SUPABASE_DB_PORT:5432}/${PROD_SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${PROD_SUPABASE_DB_USERNAME}
spring.datasource.password=${PROD_SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${PROD_DB_POOL_MAX_SIZE:2}
spring.jpa.properties.hibernate.default_schema=order_service
spring.flyway.schemas=order_service
spring.flyway.default-schema=order_service
spring.flyway.create-schemas=true
app.jwt.secret-base64=${PROD_JWT_SECRET_BASE64}
app.cors.allowed-origins=${PROD_CORS_ALLOWED_ORIGINS}
services.movie.base-url=https://${PROD_MOVIE_SERVICE_HOST}
stripe.secret-key=${PROD_STRIPE_SECRET_KEY:}
stripe.webhook-secret=${PROD_STRIPE_WEBHOOK_SECRET:}
