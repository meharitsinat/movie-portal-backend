services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: movie_select
      POSTGRES_USER: movie_select
      POSTGRES_PASSWORD: movie_select
    ports:
      - "5432:5432"
    volumes:
      - movie-select-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_select -d movie_select"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  movie-select-postgres:
