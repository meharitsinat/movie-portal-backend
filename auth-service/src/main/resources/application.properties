server.port=${SERVER_PORT:8081}
spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth_service
spring.flyway.schemas=auth_service
spring.flyway.default-schema=auth_service
spring.flyway.create-schemas=true
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
