server.port=${SERVER_PORT:8082}
spring.application.name=movie-service
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=movie_service
spring.flyway.schemas=movie_service
spring.flyway.default-schema=movie_service
spring.flyway.create-schemas=true
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
